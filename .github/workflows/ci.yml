name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          rebar3-version: "3.25"
      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Windows'
        with:
          version: 0.16.0
      - run: rebar3 ct
      - run: rebar3 clean
      - name: The clean hook removed the NIF
        shell: bash
        run: test ! -e _build/default/lib/ezstd/priv/ezstd_nif.so && test ! -e _build/default/lib/ezstd/priv/ezstd_nif.dll && test ! -e priv/ezstd_nif.so && test ! -e priv/ezstd_nif.dll
